<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tattoo Dice" />
  <style>
    html,body{margin:0;width:100%;height:100%;background:#050505;color-scheme:dark}
  </style>
  <title>Tattoo Dice</title>
  <meta name="description" content="Stop rolling. Start scrolling." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tattoo Dice" />
  <meta property="og:title" content="Tattoo Dice" />
  <meta property="og:description" content="Stop rolling. Start scrolling." />
  <meta property="og:url" content="https://tattoodice.com/" />
  <meta property="og:image" content="https://tattoodice.com/assets/social-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Tattoo Dice app with Wizard, Panther and Skull dice and a Roll button" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tattoo Dice" />
  <meta name="twitter:description" content="Stop rolling. Start scrolling." />
  <meta name="twitter:image" content="https://tattoodice.com/assets/social-preview.png" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=3.6.4-sidequest-v2.52.21-main-shake-wobble" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body style="background-color:#050505">
  <main class="app">
    <section class="stage">
      <div class="app-header">
        <h1>
          <span class="header-artwork">
            <img class="brand-logo-image app-brand-logo" src="assets/tattoo-dice-header-v2.png" alt="Tattoo Dice" />
            <canvas class="header-flare-canvas" id="headerFlareCanvas" aria-hidden="true"></canvas>
          </span>
        </h1>
      </div>
      <div class="tagline">Stop scrolling. Start rolling.</div>
      <div class="dice-stage-3d" id="diceStage3d">
        <div id="sceneWrap" aria-label="Tattoo dice result"></div>
      </div>
      <div class="controls">
        <div class="dice-count-notice controls-notice-slot" id="diceCountNotice" role="status" aria-live="polite"></div>
        
        <div class="action-row">
          <button class="theme-button" id="themeButton" type="button" aria-haspopup="dialog">
            <span>THEME</span>
          </button>
          <button class="roll-button" id="rollButton" aria-label="Roll tattoo dice">
            <span>ROLL</span>
          </button>
          <button class="main-button" id="mainButton" type="button" aria-haspopup="dialog">
            <span>MAIN</span>
          </button>
        </div>
        <div class="utility-row">
          <div class="dice-select" aria-label="Aantal woorden">
            <button class="dice-option" data-count="1" aria-label="1 woord"><span class="mini-die"><span class="pip center"></span></span></button>
            <button class="dice-option" data-count="2" aria-label="2 woorden"><span class="mini-die"><span class="pip bottom-left"></span><span class="pip top-right"></span></span></button>
            <button class="dice-option active" data-count="3" aria-label="3 woorden"><span class="mini-die"><span class="pip bottom-left"></span><span class="pip center"></span><span class="pip top-right"></span></span></button>
          </div>
          <div class="shake-control" id="shakeControl">
            <button class="shake-toggle" id="shakeToggle" type="button" aria-pressed="false">
              <span class="shake-toggle-dot" aria-hidden="true"></span>
              <span id="shakeToggleLabel">TOGGLE SHAKE</span>
            </button>
            <div class="shake-status" id="shakeStatus" role="status" aria-live="polite"></div>
          </div>
          <button class="reset-button" id="resetButton" type="button" aria-label="Reset Tattoo Dice to the opening setup">
            <span>RESET</span>
          </button>
        </div>
      </div>
    </section>
    <footer class="footer">
      <div class="counter" id="counter" aria-live="polite"></div>
      <div class="credit"><span>• by </span><a href="https://instagram.com/tattoonelis" target="_blank" rel="noopener">@tattoonelis</a><span> •</span></div>
      <button class="help-button" id="helpButton" type="button" aria-label="How to use Tattoo Dice">?</button>
    </footer>
  </main>

  <div class="main-hint-overlay" id="mainHintOverlay" aria-hidden="true">
    <div class="main-hint-message">CHOOSE A MAIN</div>
    <div class="main-hint-arrow" aria-hidden="true"></div>
    <div class="action-row main-hint-button-stage" id="mainHintButtonStage" aria-hidden="true"></div>
  </div>

  <div class="help-tour-overlay" id="helpTourOverlay" role="dialog" aria-modal="true" aria-labelledby="helpTourTitle" aria-hidden="true">
    <button class="overlay-close help-tour-close" id="helpTourClose" type="button" aria-label="Close guide">×</button>
    <div class="help-tour-message">
      <div class="help-tour-title" id="helpTourTitle"></div>
      <div class="help-tour-copy" id="helpTourCopy"></div>
      <div class="help-tour-progress" id="helpTourProgress" aria-hidden="true"></div>
    </div>
    <div class="help-tour-arrow" id="helpTourArrow" aria-hidden="true"></div>
    <div class="help-tour-target" id="helpTourTarget" aria-hidden="true"></div>
  </div>

  <div class="intro-gate" id="introGate" aria-label="Tattoo Dice loading" style="background-color:#050505">
    <div class="splash-logo-wrap">
      <div class="splash-logo" id="splashLogo">
        <span class="header-artwork">
          <img class="brand-logo-image app-brand-logo" src="assets/tattoo-dice-header-v2.png" alt="Tattoo Dice" />
          <canvas class="header-flare-canvas" id="splashHeaderFlareCanvas" aria-hidden="true"></canvas>
        </span>
      </div>
      <div class="splash-progress" aria-hidden="true"><span id="splashProgressBar"></span></div>
    </div>
  </div>

  <div class="theme-modal" id="themeModal" aria-hidden="true">
    <div class="theme-modal-backdrop" data-close-theme></div>
    <section class="theme-modal-card" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
      <button class="theme-modal-close" type="button" aria-label="Close theme menu" data-close-theme>×</button>
      <h2 id="themeModalTitle">THEME</h2>
      <button class="theme-choice active" id="classicThemeChoice" type="button" data-theme="classic" aria-pressed="true">
        <span>CLASSIC</span>
      </button>
      <button class="theme-choice locked" id="fantasyThemeChoice" type="button" data-theme="fantasy" aria-pressed="false">
        <span id="fantasyThemeLabel">Fantasy 🔒</span>
      </button>
    </section>
  </div>


  <div class="pin-modal" id="pinModal" aria-hidden="true">
    <div class="pin-modal-backdrop" data-close-pin></div>
    <section class="pin-modal-card" role="dialog" aria-modal="true" aria-labelledby="pinModalTitle">
      <button class="pin-modal-close" type="button" aria-label="Close code entry" data-close-pin>×</button>
      <h2 id="pinModalTitle">UNLOCK</h2>
      <div class="pin-subtitle">Enter the 4-digit code</div>
      <div class="pin-display" id="pinDisplay" aria-live="polite" aria-label="Code entry">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="pin-keypad" id="pinKeypad" aria-label="Numeric keypad">
        <button type="button" data-pin-digit="1">1</button>
        <button type="button" data-pin-digit="2">2</button>
        <button type="button" data-pin-digit="3">3</button>
        <button type="button" data-pin-digit="4">4</button>
        <button type="button" data-pin-digit="5">5</button>
        <button type="button" data-pin-digit="6">6</button>
        <button type="button" data-pin-digit="7">7</button>
        <button type="button" data-pin-digit="8">8</button>
        <button type="button" data-pin-digit="9">9</button>
        <button type="button" class="pin-function" data-pin-clear>CLR</button>
        <button type="button" data-pin-digit="0">0</button>
        <button type="button" class="pin-function" data-pin-backspace>⌫</button>
      </div>
    </section>
  </div>

  <div class="main-modal" id="mainModal" aria-hidden="true">
    <div class="main-modal-backdrop" data-close-main></div>
    <section class="main-modal-card" role="dialog" aria-modal="true" aria-labelledby="mainModalTitle">
      <button class="main-modal-close" type="button" aria-label="Close main menu" data-close-main>×</button>
      <h2 id="mainModalTitle">MAIN</h2>
      <div class="main-choice-list" id="mainChoiceList"></div>
    </section>
  </div>

  <div class="portrait-lock" id="portraitLock" aria-hidden="true">
    <div class="portrait-lock-card">
      <div class="portrait-lock-die-wrap" aria-hidden="true">
        <div class="portrait-lock-die">
          <span class="portrait-lock-pip pip-1"></span>
          <span class="portrait-lock-pip pip-2"></span>
          <span class="portrait-lock-pip pip-3"></span>
          <span class="portrait-lock-pip pip-4"></span>
          <span class="portrait-lock-pip pip-5"></span>
        </div>
      </div>
      <div class="portrait-lock-title">ROTATE YOUR DEVICE</div>
      <div class="portrait-lock-text">Tattoo Dice works best in portrait mode.</div>
    </div>
  </div>
  <script type="module" src="/script.js?v=3.6.4-sidequest-v2.52.21-main-shake-wobble"></script>
</body>
</html>
