<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Tattoo Dice Admin Panel</title>
  <link rel="icon" href="./assets/admin-icon-192.png">
  <link rel="apple-touch-icon" href="./assets/admin-icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./admin-panel.css?v=1">
</head>
<body class="panel-locked">
  <div class="panel-pin" id="panelPin" role="dialog" aria-modal="true" aria-label="Tattoo Dice Admin access">
    <section class="pin-card">
      <img src="./assets/admin-ranking-header.png" alt="Tattoo Dice Admin">
      <p>Enter the six-digit PIN.</p>
      <div class="pin-dots" id="panelPinDots" aria-label="PIN entry"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="pin-grid" id="panelPinGrid">
        <button data-pin="1">1</button><button data-pin="2">2</button><button data-pin="3">3</button>
        <button data-pin="4">4</button><button data-pin="5">5</button><button data-pin="6">6</button>
        <button data-pin="7">7</button><button data-pin="8">8</button><button data-pin="9">9</button>
        <button data-action="clear">C</button><button data-pin="0">0</button><button data-action="back">⌫</button>
      </div>
      <p class="pin-status" id="panelPinStatus" role="status"></p>
    </section>
  </div>

  <main class="panel" id="adminPanel" aria-hidden="true">
    <header class="panel-header">
      <img src="./assets/admin-ranking-header.png" alt="Tattoo Dice Admin">
      <h1>ADMIN PANEL</h1>
      <p>Build, test and improve Tattoo Dice from anywhere.</p>
    </header>

    <nav class="panel-grid" aria-label="Admin tools">
      <a class="panel-card live" href="/">
        <span class="card-icon">●</span><strong>LIVE APP</strong><small>Open the public Tattoo Dice app</small>
      </a>
      <a class="panel-card test" href="./generator/">
        <span class="card-icon">◆</span><strong>TESTVERSIE</strong><small>Try the complete generator safely</small>
      </a>
      <a class="panel-card ranking" href="./ranking/">
        <span class="card-icon">✓</span><strong>RANKING</strong><small>Judge rolls and train relationships</small>
      </a>
      <a class="panel-card canon" href="./canon/">
        <span class="card-icon">≡</span><strong>CANON</strong><small>Manage themes, words and families</small>
      </a>
    </nav>

    <footer><span>ALL SYSTEMS CONNECTED</span><strong>V0.2.59</strong></footer>
  </main>
  <script src="./admin-panel.js?v=1"></script>
</body>
</html>
