[build]
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/generator"
  to = "/generator/"
  status = 301

[[redirects]]
  from = "/canon"
  to = "/canon/"
  status = 301

[[headers]]
  for = "/generator/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/canon/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
